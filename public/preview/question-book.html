<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>题目本 · UI 预览</title>
<style>
:root{color-scheme:light;--ink:#282827;--muted:#505d75;--brand:#3451d1;--soft:#edf0fa;--line:rgba(69,91,139,.1)}
*{box-sizing:border-box}body{margin:0;font:14px/1.65 -apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--ink);background:#e9edf2}button,a{-webkit-tap-highlight-color:transparent}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0}button:focus-visible,a:focus-visible{outline:2px solid var(--brand);outline-offset:3px}::selection{background:#dbe3ff}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}.demo{max-width:430px;margin:16px auto 8px;padding:0 16px;color:#505d75;font-size:12px}.app{max-width:430px;min-height:calc(100dvh - 48px);margin:auto;position:relative;background:radial-gradient(ellipse at 110% 6%,rgba(110,147,225,.1),transparent 52%),radial-gradient(ellipse at -20% 60%,rgba(165,194,239,.14),transparent 54%),linear-gradient(155deg,#fdfefe 0%,#f7f9fd 55%,#f0f5fa 100%);background-attachment:fixed}
header{height:56px;display:flex;align-items:center;justify-content:center;position:relative}h1{font-size:17px;font-weight:500;margin:0}.back{position:absolute;left:8px;display:grid;place-items:center;width:40px;height:40px;color:var(--ink);text-decoration:none;background:transparent}main{padding:4px 16px 90px}.filters{display:flex;gap:6px;overflow:auto;scrollbar-width:none;padding:4px 0 12px}.filter{flex:none;white-space:nowrap;min-height:30px;padding:3px 11px;border-radius:16px;background:rgba(255,255,255,.65);font-size:13px;color:var(--muted)}.filter[aria-pressed=true]{background:var(--brand);color:#fff}.list{border-radius:16px;background:rgba(255,255,255,.8);overflow:hidden;margin-bottom:16px}.row{width:100%;display:block;background:transparent;text-align:left;padding:12px 14px}.row+.row{border-top:1px solid var(--line)}.row:hover{background:rgba(232,237,255,.3)}.meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);line-height:18px;margin-bottom:5px}.type{color:var(--brand)}.row-heading{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}.row-meta{display:flex;align-items:center;gap:6px;flex:none}.row-heading h2{flex:1;min-width:0}.row-heading .type{flex:none;font-size:11px;line-height:18px;padding:1px 6px;border-radius:5px;font-weight:400}.type[data-type="搜题"]{color:#3b579b;background:#edf1fb}.type[data-type="解题"]{color:#5f528c;background:#f1eef8}.type[data-type="AI 出题"]{color:#397467;background:#edf5f2}.type[data-type="错题"]{color:#975a40;background:#f8eee8}.row h2{font-size:14px;line-height:1.55;font-weight:500;margin:0}.excerpt{font-size:13px;line-height:1.65;margin:0;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.empty{text-align:center;padding:64px 10px;color:var(--muted)}.empty h2{font-size:16px;font-weight:500;color:var(--ink)}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);display:flex;justify-content:space-around;padding:7px 12px max(8px,env(safe-area-inset-bottom));background:rgba(249,251,254,.94);backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:64px;padding:3px 12px;text-decoration:none;color:var(--muted);font-size:11px;background:transparent}.nav.active{color:var(--brand)}.nav.active svg{background:#e8edff;border-radius:5px;outline:4px solid #e8edff;margin:2px 0}.nav svg{width:20px;height:20px}
dialog{border:0;padding:0;width:min(430px,100%);max-width:100%;max-height:92dvh;height:92dvh;margin:auto auto 0;border-radius:20px 20px 0 0;background:#f4f4f4;color:var(--ink)}dialog::backdrop{background:rgba(25,35,55,.26);backdrop-filter:blur(3px)}.detail-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#f4f4f4}.detail-head h2{font-size:16px;margin:0;font-weight:500}.icon{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:transparent}.detail-body{padding:0 16px 28px}.detail-title{font-size:17px;line-height:1.5;margin:6px 0 14px;font-weight:600}.panel{background:white;padding:12px;border-radius:14px;margin-bottom:12px}.panel h3{font-size:14px;margin:0 0 7px;font-weight:600}.panel p{font-size:14px;margin:0;line-height:1.75}.label{font-size:12px;color:var(--muted);margin-bottom:6px}.answer{font-size:14px}.text-action{display:flex;align-items:center;gap:6px;min-height:40px;background:none;color:var(--brand);padding:4px 0;font-size:13px;text-align:left}.text-action svg{width:15px;height:15px}.detail-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}.remove{font-size:12px;color:var(--muted);background:transparent;min-height:40px;padding:4px}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:5;background:#293145;color:white;border-radius:12px;padding:10px 14px;font-size:12px;display:flex;gap:16px;align-items:center;white-space:nowrap}.toast button{background:none;color:#c7d4ff;padding:0}.toast[hidden]{display:none}@media(max-width:500px){body{background:#f8fafc}.demo{margin-top:6px;font-size:11px}.app{min-height:calc(100dvh - 32px)}}@media(prefers-reduced-motion:no-preference){dialog[open]{animation:appear .18s ease-out}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style>
</head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0"><defs><symbol id="arrow" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v14a4 4 0 0 0-4-2H4zM14 7a3 3 0 0 1 3-3h3v15h-3a4 4 0 0 0-3 2"/></symbol><symbol id="chat" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 1-8 8H5l-3 3V11a9 9 0 0 1 18 0Z"/><path d="M7 9h8M7 13h5"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol></defs></svg>
<p class="demo">题目本 · 交互原型，内容为示例</p>
<div class="app"><header><a class="back" href="/" aria-label="返回首页"><svg><use href="#back"/></svg></a><h1>题目本</h1></header><main><nav class="filters" aria-label="题目类型"></nav><div id="content"></div></main><nav class="bottom" aria-label="主导航"><a class="nav" href="/"><svg><use href="#chat"/></svg>首页</a><button class="nav active" aria-current="page"><svg><use href="#book"/></svg>题目本</button><a class="nav" href="/history"><svg><use href="#clock"/></svg>记录</a></nav></div>
<dialog aria-labelledby="detail-name"><div class="detail-head"><h2 id="detail-name">题目与解析</h2><button class="icon" id="close-detail" aria-label="关闭详情"><svg><use href="#close"/></svg></button></div><div class="detail-body" id="detail"></div></dialog><div class="toast" role="status" hidden></div>
<script>
const data=[
{id:1,type:'错题',group:'今天',time:'10:42',title:'数轴上线段覆盖的整点个数',stem:'数轴的单位长度为 1 cm，在数轴上画出一条长为 2023 cm 的线段 AB，则 AB 盖住的整点个数是？',note:'只考虑端点都是整点，漏掉了另一种情况。',answer:'A．2023 个或 2024 个',reason:'把“长度是整数”当成了“端点是整点”。端点位置没有限定，因此要分端点落在整点和非整点两种情况。',thinking:'先判断端点是否为整点。两端均为整点时有 2024 个；两端均不是整点时有 2023 个。'},
{id:2,type:'搜题',group:'今天',time:'09:18',title:'用配方法求二次函数的最值',stem:'已知 y = −x² + 2x + 7/4，求这个二次函数的最大值，并写出此时 x 的值。',note:'二次函数 · 配方法',answer:'当 x = 1 时，y 的最大值为 11/4。',thinking:'配方得 y = −(x − 1)² + 11/4。因为平方项非负，所以函数值不大于 11/4。'},
{id:3,type:'解题',group:'今天',time:'08:56',title:'等腰三角形中的角度关系',stem:'在 △ABC 中，AB = AC，点 D 在 BC 上。若 ∠BAD = 20°，∠ADC = 70°，求 ∠BAC。',note:'拍照解题 · 三角形',answer:'∠BAC = 80°。',thinking:'由 ∠ADC = 70°，得到 ∠ADB = 110°。在 △ABD 中求出 ∠ABD = 50°，再利用两个底角相等，得到顶角为 80°。'},
{id:4,type:'AI 出题',group:'昨天',time:'20:35',title:'配方法基础练习',stem:'将 y = 2x² − 4x + 1 化为顶点式，并写出对称轴、顶点坐标和函数的最小值。',note:'生成练习 · 基础',answer:'y = 2(x − 1)² − 1；对称轴 x = 1，顶点 (1, −1)，最小值 −1。',thinking:'先提出二次项系数 2，再在括号内配成完全平方式，最后合并常数项。'},
{id:5,type:'错题',group:'昨天',time:'19:12',title:'一元一次方程中的去括号',stem:'解方程：3(x − 2) − 2(2x + 1) = 5。',note:'去括号时没有将负号乘到每一项。',answer:'x = −13。',reason:'−2(2x + 1) 展开应为 −4x − 2，负号需要同时作用于括号里的两项。',thinking:'去括号得 3x − 6 − 4x − 2 = 5，合并后 −x − 8 = 5，解得 x = −13。'},
{id:6,type:'搜题',group:'昨天',time:'16:40',title:'圆的切线与半径',stem:'已知 PA、PB 是圆 O 的两条切线，A、B 为切点，若 ∠APB = 60°，求 ∠AOB。',note:'圆 · 切线性质',answer:'∠AOB = 120°。',thinking:'半径垂直于经过切点的切线，四边形 OAPB 中有两个直角，利用四边形内角和求解。'}];
const categoryLabels={'全部':'全部','搜题':'找题练习','解题':'解题答疑','AI 出题':'AI 出题','错题':'错题分析'};let current='全部',selected=null,removed=null;const filters=document.querySelector('.filters'),content=document.querySelector('#content'),dialog=document.querySelector('dialog'),toast=document.querySelector('.toast');
function render(){filters.replaceChildren();for(const name of ['全部','搜题','解题','AI 出题','错题']){const b=document.createElement('button');b.className='filter';b.textContent=categoryLabels[name];b.setAttribute('aria-pressed',String(current===name));b.onclick=()=>{current=name;render()};filters.append(b)}content.replaceChildren();const rows=data.filter(x=>x!==removed&&(current==='全部'||x.type===current));if(rows.length){const list=document.createElement('section');list.className='list';for(const row of rows){const b=document.createElement('button');b.className='row';b.innerHTML=`<div class="row-heading"><h2>${row.title}</h2><span class="row-meta"><span class="type" data-type="${row.type}">${categoryLabels[row.type]}</span></span></div><p class="excerpt">${row.stem}</p>`;b.onclick=()=>open(row);list.append(b)}content.append(list)}if(!rows.length)content.innerHTML='<div class="empty"><h2>这里还没有题目</h2><p>对话中展示的题目会自动收录到这里。</p></div>'}
function panel(title,text){return `<section class="panel"><h3>${title}</h3><p>${text}</p></section>`}
function open(row){selected=row;document.querySelector('#detail-name').textContent=row.type==='错题'?'错题分析':'题目与解析';document.querySelector('#detail').innerHTML=`<div class="meta"><span class="type" data-type="${row.type}">${categoryLabels[row.type]}</span><span>${row.group} ${row.time}</span></div><h2 class="detail-title">${row.title}</h2>${row.type==='错题'?`<section class="panel"><div class="label">正确答案</div><p class="answer">${row.answer}</p></section>${panel('错误原因',row.reason)}${panel('正确思路',row.thinking)}<button class="text-action" id="original">查看原题与作答 <svg><use href="#arrow"/></svg></button><div id="original-content" hidden>${panel('原题',row.stem)}${panel('我的作答',row.id===1?'C．2024 个':'x = −9')}</div><button class="text-action" id="derivation">查看完整解析与推导</button>`:`${panel('题目',row.stem)}${panel('答案',row.answer)}${panel('解析',row.thinking)}`}<div class="detail-foot"><button class="text-action" id="continue">回到原对话 <svg><use href="#arrow"/></svg></button><button class="remove" id="remove">从题目本移除</button></div>`;document.querySelector('#original')?.addEventListener('click',()=>{const box=document.querySelector('#original-content');box.hidden=!box.hidden});document.querySelector('#derivation')?.addEventListener('click',()=>notice('此处将回到原会话，继续生成完整推导'));document.querySelector('#continue').onclick=()=>notice('此处将返回原会话，并定位到这道题');document.querySelector('#remove').onclick=()=>{removed=row;dialog.close();render();notice('已从题目本移除',true)};dialog.showModal()}
function notice(text,undo=false){clearTimeout(window.toastTimer);toast.replaceChildren();toast.append(document.createTextNode(text));if(undo){const b=document.createElement('button');b.textContent='撤销';b.onclick=()=>{removed=null;render();toast.hidden=true};toast.append(b)}toast.hidden=false;window.toastTimer=setTimeout(()=>toast.hidden=true,5000)}document.querySelector('#close-detail').onclick=()=>dialog.close();render();
</script>
</body></html>
